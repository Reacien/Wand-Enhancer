name: Auto Sync and Build

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to manually click "Run workflow" anytime

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        id: sync
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com"
          source_branch: "master"
          destination_branch: "master"
          github_token: ${{ secrets.PAT_TOKEN }} # Uses a Personal Access Token to trigger other workflows

      - name: Trigger Build Workflow
        # Only triggers the build if the sync step successfully brought in new commits
        if: steps:sync.outputs.has_new_commits == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"master"}'
